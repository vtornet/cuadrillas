# Config de despliegue para Cloudflare (Workers Builds, sistema unificado que
# sustituye a Pages). Sin este archivo, "wrangler deploy" no sabe que este
# repo es un Worker de solo-estaticos y, al estar en la raiz de un monorepo
# pnpm, su logica de "adivinar la aplicacion" falla.
name = "cuadrillas"
compatibility_date = "2026-09-04"

[assets]
directory = "app/dist"
not_found_handling = "single-page-application"
